syntax = "proto3";

package hotrank;

option java_multiple_files = true;
option java_package = "com.example.orderdemo.grpc";
option java_outer_classname = "HotRankProto";
option go_package = "github.com/whening/hotrank-agent-loop/gateway/proto";

service HotRankCommandService {
  rpc BoostExposure (BoostExposureRequest) returns (BoostExposureResponse);
}

service HotRankQueryServiceGrpc {
  rpc GetTopK (GetTopKRequest) returns (GetTopKResponse);
}

message BoostExposureRequest {
  string target_content_id = 1;
  int32 weight = 2;
  string region = 3;
  string idempotency_key = 4;
  string decision_source = 5;
}

message BoostExposureResponse {
  bool accepted = 1;
  string reason = 2;
  string idempotency_key = 3;
}

message GetTopKRequest {
  string region = 1;
  int32 k = 2;
}

message GetTopKResponse {
  repeated RankedItem items = 1;
}

message RankedItem {
  string content_id = 1;
  double score = 2;
  int32 rank = 3;
}