spring:
  application:
    name: order-demo
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: 8719
      eager: false
    compatibility-verifier:
      enabled: false
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/order_demo?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 1000
    consumer:
      group-id: hotrank-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

rocketmq:
  name-server: localhost:9876
  producer:
    group: hotrank-producer

inventory:
  reservation:
    timeout-minutes: 30

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

seata:
  enabled: true
  enable-auto-data-source-proxy: false
  application-id: hotrank-service
  tx-service-group: hotrank-tx-group
  service:
    vgroup-mapping:
      hotrank-tx-group: default
    grouplist:
      default: 127.0.0.1:8091
  registry:
    type: file
  config:
    type: file

logging:
  level:
    com.example.orderdemo: INFO
  file:
    name: logs/order-demo.log